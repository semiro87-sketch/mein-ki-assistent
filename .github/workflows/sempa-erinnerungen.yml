
name: SEMPA Erinnerungen Test

on:
  workflow_dispatch:

jobs:
  erinnern:
    runs-on: ubuntu-latest
    steps:
      - name: Erinnerungen auslösen
        env:
          SEMPA_CRON_SECRET: ${{ secrets.SEMPA_TEST_CRON_SECRET }}
        run: |
          if [ -z "$SEMPA_CRON_SECRET" ]; then
            echo "SEMPA_TEST_CRON_SECRET fehlt"
            exit 1
          fi

          curl --fail-with-body --show-error --silent \
            --retry 2 \
            --retry-delay 20 \
            --max-time 90 \
            --request POST \
            --url "https://sempa-3-2-test.onrender.com/api/cron/erinnerungen" \
            --header "X-SEMPA-Cron-Secret: $SEMPA_CRON_SECRET"
