
name: SEMPA Erinnerungen Test

on:
  workflow_dispatch:

jobs:
  erinnern:
    runs-on: ubuntu-latest
    steps:
      - name: Erinnerungen auslösen
        env:
          SEMPA_URL: ${{ secrets.SEMPA_TEST_URL }}
          SEMPA_CRON_SECRET: ${{ secrets.SEMPA_TEST_CRON_SECRET }}
        run: |
          if [ -z "$SEMPA_URL" ]; then
            echo "SEMPA_TEST_URL fehlt"
            exit 1
          fi

          if [ -z "$SEMPA_CRON_SECRET" ]; then
            echo "SEMPA_TEST_CRON_SECRET fehlt"
            exit 1
          fi

          curl --show-error --silent \ 
            --retry 2 \
            --retry-delay 20 \
            --max-time 90 \
            -X POST "https://sempa-3-2-test.onrender.com/api/cron/erinnerungen" \
            -H "X-SEMPA-Cron-Secret: $(printf '%s' "$SEMPA_CRON_SECRET" | tr -d '\r\n')"
